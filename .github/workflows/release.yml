name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: '4thbutton'
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/4thButton-v${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4thButton-apk
          path: release/4thButton-v*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/4thButton-v*.apk
          generate_release_notes: true
          body: |
            ## 4thButton ${{ github.ref_name }}

            Floating accessibility button: screenshot, power menu, screen lock and flashlight.

            ### Supported Android versions
            - **minSdk:** 28 (Android 9.0 Pie)
            - **targetSdk / compileSdk:** 35 (Android 15)
            - **Tested on:** Android 12 (API 31)
            - **Screenshot:** requires Android 11+ (API 30+) — public API minimum

            Install the APK and enable the **Accessibility Service** for the floating button to appear.
